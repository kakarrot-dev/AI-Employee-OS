name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./scripts/check.sh
