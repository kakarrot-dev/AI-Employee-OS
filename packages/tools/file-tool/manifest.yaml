schema_version: 1.0.0
tool:
  id: file-tool
  name: File Tool
  version: 1.0.0
  description: Read, create, and edit authorized local UTF-8 files
  type: native
  runtime: rust-native-v1
  entrypoint: file_tool
  actions:
    - name: read_file
      description: Read one authorized local UTF-8 file
      input_schema:
        type: object
        additionalProperties: false
        required: [path]
        properties:
          path: {type: string}
      output_schema:
        type: object
        additionalProperties: false
        required: [content]
        properties:
          content: {type: string}
      required_permissions: [filesystem.read]
      risk_level: 0
      side_effect: none
      confirmation: never
      timeout_ms: 10000
      idempotency: safe
      concurrency_safe: true
      retry_policy: {max_attempts: 1, retry_on: []}
      result_size_limit: 1048576
      sensitive_fields: [arguments.path]
      verification: none
    - name: create_file
      description: Create one new authorized local UTF-8 file without overwriting an existing file
      input_schema:
        type: object
        additionalProperties: false
        required: [path, content]
        properties:
          path: {type: string}
          content: {type: string}
      output_schema:
        type: object
        additionalProperties: false
        required: [path, bytes_written]
        properties:
          path: {type: string}
          bytes_written: {type: integer}
      required_permissions: [filesystem.write]
      risk_level: 2
      side_effect: reversible
      confirmation: always
      timeout_ms: 10000
      idempotency: keyed
      concurrency_safe: false
      retry_policy: {max_attempts: 1, retry_on: []}
      result_size_limit: 4096
      sensitive_fields: [arguments.path, arguments.content]
      verification: required
    - name: edit_file
      description: Replace one unique exact text occurrence in an authorized local UTF-8 file
      input_schema:
        type: object
        additionalProperties: false
        required: [path, old_text, new_text]
        properties:
          path: {type: string}
          old_text: {type: string}
          new_text: {type: string}
      output_schema:
        type: object
        additionalProperties: false
        required: [path, replacements]
        properties:
          path: {type: string}
          replacements: {type: integer}
      required_permissions: [filesystem.write]
      risk_level: 2
      side_effect: reversible
      confirmation: always
      timeout_ms: 10000
      idempotency: keyed
      concurrency_safe: false
      retry_policy: {max_attempts: 1, retry_on: []}
      result_size_limit: 4096
      sensitive_fields: [arguments.path, arguments.old_text, arguments.new_text]
      verification: required
