schema_version: 1.0.0
engine: runtime-dag-v2
max_steps: 4
steps:
  - id: extract-facts
    depends_on: []
    output_as: facts
    timeout_ms: 30000
    retry_policy: {max_attempts: 1}
  - id: synthesize-review
    depends_on: [extract-facts]
    output_as: review
    timeout_ms: 30000
    retry_policy: {max_attempts: 1}
