schema_version: 2.0.0
skill:
  id: review-pipeline
  name: 两阶段审阅
  version: 1.0.0
  description: 先提取事实，再生成审阅结论的通用确定顺序流程。
  category: general
  runtime_compatibility: ">=2.0.0 <3.0.0"
  status: active
  instructions: SKILL.md
  routing:
    explicit: true
    triggers: [review, 审阅]
    positive_examples: ["审阅这段材料"]
    negative_examples: ["把内容写入文件"]
  context: {required: [], optional: [], max_bytes: 65536}
  tools: []
  input_schema:
    type: object
    additionalProperties: false
    required: [text]
    properties: {text: {type: string}}
  output_schema:
    type: object
    additionalProperties: false
    required: [summary]
    properties: {summary: {type: string}}
  execution:
    mode: workflow
    workflow: workflow.yaml
    max_model_turns: 4
    max_tool_calls: 0
    max_duration_ms: 60000
    on_result_unknown: stop
  deliverables: {required: false, allowed_types: [structured_result], evidence: output_schema}
  evaluation: {timing: before_delivery, block_on_failure: true, suite: evals/suite.json}
