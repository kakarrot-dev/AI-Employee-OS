schema_version: 1.0.0
skill:
  id: requirement-analysis
  name: Requirement Analysis
  version: 1.0.0
  description: 将原始需求整理为可验证的产品问题与范围。
  category: product
  runtime_compatibility: ">=1.0.0 <2.0.0"
  status: active
  entrypoint: workflows/requirement-analysis.yaml
  triggers: {task_types: [requirement_analysis], intents: [analyze_requirement], priority: 100}
  required_context: []
  optional_context:
    - {type: memory, selector: user_preferences, max_items: 10, on_missing: continue}
  required_tools: []
  input_schema:
    type: object
    additionalProperties: false
    required: [requirement]
    properties: {requirement: {type: string}}
  output_schema:
    type: object
    additionalProperties: false
    required: [problem, value, scope, unknowns, acceptance_criteria]
    properties:
      problem: {type: string}
      value: {type: string}
      scope: {type: array, items: {type: string}}
      unknowns: {type: array, items: {type: string}}
      acceptance_criteria: {type: array, items: {type: string}}
  artifact_types: []
  workflow:
    engine: runtime-dag-v1
    max_steps: 4
    steps:
      - id: analyze
        depends_on: []
        input_from: [skill.input, context.user_preferences]
        output_as: analysis
        timeout_ms: 30000
        retry_policy: {max_attempts: 1}
        on_failure: fail_skill
  completion: {required_steps: [analyze], allow_partial: false}
  evaluation: {timing: before_delivery, block_on_failure: true, metrics: []}
