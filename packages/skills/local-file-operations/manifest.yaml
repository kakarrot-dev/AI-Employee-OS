schema_version: 2.0.0
skill:
  id: local-file-operations
  name: 本地文件操作
  version: 1.0.0
  description: 在用户授权目录内读取、创建或精确编辑 UTF-8 文件。
  category: general
  runtime_compatibility: ">=2.0.0 <3.0.0"
  status: active
  instructions: SKILL.md
  routing:
    explicit: true
  context: {required: [], optional: [], max_bytes: 65536}
  tools:
    - id: file-tool
      version: ">=1.0.0 <2.0.0"
      actions: [read_file, create_file, edit_file]
      max_calls: 1
      allow_side_effects: true
      on_missing: fail
  input_schema:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      text: {type: string}
  output_schema:
    type: object
    additionalProperties: false
    required: [summary]
    properties:
      summary: {type: string}
      path: {type: string}
      content: {type: string}
  execution: {mode: agent_loop, max_model_turns: 3, max_tool_calls: 1, max_duration_ms: 60000, on_result_unknown: stop}
  deliverables: {required: false, allowed_types: [structured_result], evidence: output_schema}
  evaluation: {timing: before_delivery, block_on_failure: true, suite: evals/suite.json}
