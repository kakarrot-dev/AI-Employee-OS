schema_version: 1.0.0
engine: runtime-dag-v2
max_steps: 3
steps:
  - id: review-content
    depends_on: []
    output_as: review
    timeout_ms: 30000
    retry_policy: {max_attempts: 1}
  - id: save-approved-content
    depends_on: [review-content]
    output_as: artifact
    tool: {id: document-tool, action: create_markdown}
    arguments: {path: "$input.path", content: "$input.content"}
    timeout_ms: 30000
    retry_policy: {max_attempts: 1}
