schema_version: 2.0.0
skill:
  id: web-search
  name: 网络搜索
  version: 1.0.0
  description: 通过 Agent Reach 搜索公开网页，并基于返回来源回答。
  category: research
  runtime_compatibility: ">=2.0.0 <3.0.0"
  status: active
  instructions: SKILL.md
  routing:
    explicit: true
  context: {required: [], optional: [], max_bytes: 65536}
  tools:
    - id: agent-reach-tool
      version: ">=1.0.0 <2.0.0"
      actions: [search_web]
      max_calls: 1
      allow_side_effects: false
      on_missing: fail
  input_schema:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      text: {type: string}
  output_schema:
    type: object
    additionalProperties: false
    required: [answer, sources]
    properties:
      answer: {type: string}
      sources:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [title, url]
          properties:
            title: {type: string}
            url: {type: string}
  execution: {mode: agent_loop, max_model_turns: 3, max_tool_calls: 1, max_duration_ms: 60000, on_result_unknown: stop}
  deliverables: {required: false, allowed_types: [structured_result], evidence: output_schema}
  evaluation: {timing: before_delivery, block_on_failure: true, suite: evals/suite.json}
