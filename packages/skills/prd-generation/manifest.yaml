schema_version: 1.0.0
skill:
  id: prd-generation
  name: PRD Generation
  version: 1.0.0
  description: 根据需求分析和本地资料生成可评审 PRD。
  category: product
  runtime_compatibility: ">=1.0.0 <2.0.0"
  status: active
  entrypoint: workflows/prd-generation.yaml
  triggers: {task_types: [product_design], intents: [create_prd], priority: 100}
  required_context:
    - {type: knowledge, selector: product_docs, max_items: 20, on_missing: fail}
  optional_context:
    - {type: memory, selector: user_preferences, max_items: 10, on_missing: continue}
  required_tools:
    - id: document-tool
      version: ">=1.0.0 <2.0.0"
      actions: [create_markdown]
      required: true
      permissions: [document.write]
      max_calls: 1
      allow_parallel: false
      allow_side_effects: true
      on_missing: fail
  input_schema:
    type: object
    additionalProperties: false
    required: [requirement]
    properties: {requirement: {type: string}}
  output_schema:
    type: object
    additionalProperties: false
    required: [artifact_ref, summary]
    properties: {artifact_ref: {type: string}, summary: {type: string}}
  artifact_types: [markdown_document]
  workflow:
    engine: runtime-dag-v1
    max_steps: 8
    steps:
      - id: analyze
        depends_on: []
        input_from: [skill.input, context.product_docs, context.user_preferences]
        output_as: analysis
        timeout_ms: 30000
        retry_policy: {max_attempts: 1}
        on_failure: fail_skill
      - id: write
        depends_on: [analyze]
        input_from: [steps.analyze.analysis]
        output_as: document
        tool: {id: document-tool, action: create_markdown}
        approval: inherit_tool_policy
        timeout_ms: 30000
        retry_policy: {max_attempts: 1}
        on_failure: fail_skill
  completion: {required_steps: [analyze, write], allow_partial: false}
  evaluation:
    timing: before_delivery
    block_on_failure: true
    metrics:
      - {name: completeness, type: rubric, threshold: 0.8, method: references/prd-rubric.md}
